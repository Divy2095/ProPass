version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: propass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propass_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REMOVED_SECRET}
      POSTGRES_DB: ${POSTGRES_DB:-propass_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propass_user} -d ${POSTGRES_DB:-propass_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: propass_postgres_data
